<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scripts Platform — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #060f09;
      --surface: #0e1f14;
      --card: #112a1a;
      --border: #1c3d27;
      --green: #00e87a;
      --green-dim: rgba(0,232,122,0.12);
      --green-glow: rgba(0,232,122,0.25);
      --text: #e8f5e9;
      --muted: rgba(232,245,233,0.5);
      --danger: #ff6b6b;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image:
        radial-gradient(ellipse 60% 60% at 20% 30%, rgba(0,232,122,0.06) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 80% 70%, rgba(0,232,122,0.04) 0%, transparent 70%);
    }
    .login-wrap {
      width: 100%;
      max-width: 420px;
    }
    .logo {
      text-align: center;
      margin-bottom: 40px;
    }
    .logo-mark {
      width: 56px;
      height: 56px;
      background: var(--green-dim);
      border: 1.5px solid var(--green);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 0 32px var(--green-glow);
    }
    .logo-mark svg { width: 28px; height: 28px; }
    .logo h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .logo h1 span { color: var(--green); }
    .logo p { color: var(--muted); font-size: 0.875rem; margin-top: 4px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px;
    }
    .card h2 {
      font-family: 'Syne', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .field { margin-bottom: 18px; }
    .field label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .field input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px var(--green-dim);
    }
    .btn {
      width: 100%;
      background: var(--green);
      color: #060f09;
      border: none;
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      padding: 14px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 8px;
    }
    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error-msg {
      background: rgba(255,107,107,0.12);
      border: 1px solid rgba(255,107,107,0.3);
      border-radius: 8px;
      color: var(--danger);
      font-size: 0.875rem;
      padding: 12px 14px;
      margin-bottom: 16px;
      display: none;
    }
    .error-msg.show { display: block; }
    .footer-note {
      text-align: center;
      color: var(--muted);
      font-size: 0.8125rem;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#00e87a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <h1>Scripts <span>Platform</span></h1>
      <p>Central de scripts de vendas</p>
    </div>
    <div class="card">
      <h2>Entrar na plataforma</h2>
      <div class="error-msg" id="errorMsg"></div>
      <div class="field">
        <label>E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" />
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="btn" id="loginBtn" onclick="login()">Entrar</button>
    </div>
    <div class="footer-note">
      Acesso restrito. Solicite ao administrador.
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://opssjtkciavzcqapbzla.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9wc3NqdGtjaWF2emNxYXBiemxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDE1NDUsImV4cCI6MjA5NDYxNzU0NX0.9gG7v5Y3Hzq0GeNEz2opz9WEaPjnBTd5k9JAu365QUM';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    // Redireciona se já estiver logado
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) redirectByRole(session.user.id);
    })();

    async function redirectByRole(userId) {
      const { data: profile } = await sb.from('profiles').select('role, company_id').eq('id', userId).single();
      if (!profile) return;
      if (profile.role === 'admin') {
        window.location.href = '/admin.html';
      } else if (!profile.company_id) {
        window.location.href = '/setup.html';
      } else {
        window.location.href = '/app.html';
      }
    }

    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('errorMsg');

      err.classList.remove('show');

      if (!email || !password) {
        err.textContent = 'Preencha e-mail e senha.';
        err.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Entrando...';

      const { data, error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        err.textContent = error.message === 'Invalid login credentials'
          ? 'E-mail ou senha incorretos.'
          : error.message;
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Entrar';
        return;
      }

      await redirectByRole(data.user.id);
    }

    // Submit com Enter
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
