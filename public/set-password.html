<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar senha — Scripts Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #060f09; --surface: #0e1f14; --card: #112a1a; --border: #1c3d27;
      --green: #00e87a; --green-dim: rgba(0,232,122,0.12); --green-glow: rgba(0,232,122,0.25);
      --text: #e8f5e9; --muted: rgba(232,245,233,0.5); --danger: #ff6b6b;
    }
    body {
      font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
      background-image:
        radial-gradient(ellipse 60% 60% at 20% 30%, rgba(0,232,122,0.06) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 80% 70%, rgba(0,232,122,0.04) 0%, transparent 70%);
    }
    .wrap { width: 100%; max-width: 420px; }
    .logo { text-align: center; margin-bottom: 36px; }
    .logo-mark {
      width: 56px; height: 56px; background: var(--green-dim); border: 1.5px solid var(--green);
      border-radius: 16px; display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 14px; box-shadow: 0 0 32px var(--green-glow);
    }
    .logo-mark svg { width: 28px; height: 28px; }
    .logo h1 { font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
    .logo h1 span { color: var(--green); }
    .logo p { color: var(--muted); font-size: 0.875rem; margin-top: 4px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 36px;
    }
    .card-header { margin-bottom: 24px; }
    .card-header h2 { font-family: 'Syne', sans-serif; font-size: 1.25rem; font-weight: 700; margin-bottom: 6px; }
    .card-header p { color: var(--muted); font-size: 0.875rem; line-height: 1.5; }
    .welcome-name { color: var(--green); }
    .field { margin-bottom: 18px; }
    .field label {
      display: block; font-size: 0.8125rem; font-weight: 500; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px;
    }
    .field input {
      width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 1rem;
      padding: 12px 16px; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-dim); }
    .password-strength { height: 3px; border-radius: 3px; margin-top: 8px; background: var(--border); overflow: hidden; }
    .password-strength-fill { height: 100%; border-radius: 3px; width: 0; transition: width 0.3s, background 0.3s; }
    .strength-text { font-size: 0.75rem; color: var(--muted); margin-top: 5px; }
    .btn {
      width: 100%; background: var(--green); color: #060f09; border: none; border-radius: 10px;
      font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700;
      padding: 14px; cursor: pointer; transition: opacity 0.2s, transform 0.1s; margin-top: 8px;
    }
    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .error-msg {
      background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.3);
      border-radius: 8px; color: var(--danger); font-size: 0.875rem;
      padding: 12px 14px; margin-bottom: 16px; display: none;
    }
    .error-msg.show { display: block; }
    .loading-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px;
    }
    .spinner {
      width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--green);
      border-radius: 50%; animation: spin 0.7s linear infinite; margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-state p { color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#00e87a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <h1>Scripts <span>Platform</span></h1>
      <p>Central de scripts de vendas</p>
    </div>

    <div class="card">
      <!-- Estado de loading enquanto processa o token -->
      <div class="loading-state" id="loadingState">
        <div class="spinner"></div>
        <p>Verificando seu acesso...</p>
      </div>

      <!-- Formulário de senha -->
      <div id="formState" style="display:none">
        <div class="card-header">
          <h2>Criar sua senha</h2>
          <p>Olá<span id="welcomeName" class="welcome-name"></span>! Crie uma senha para acessar a plataforma.</p>
        </div>
        <div class="error-msg" id="errorMsg"></div>
        <div class="field">
          <label>Nova senha</label>
          <input type="password" id="password" placeholder="Mínimo 8 caracteres" oninput="checkStrength(this.value)" />
          <div class="password-strength"><div class="password-strength-fill" id="strengthFill"></div></div>
          <div class="strength-text" id="strengthText"></div>
        </div>
        <div class="field">
          <label>Confirmar senha</label>
          <input type="password" id="passwordConfirm" placeholder="Repita a senha" />
        </div>
        <button class="btn" id="saveBtn" onclick="savePassword()">Criar senha e entrar</button>
      </div>

      <!-- Estado de erro (link inválido/expirado) -->
      <div id="errorState" style="display:none; text-align:center; padding:20px 0;">
        <p style="color:var(--danger); margin-bottom:16px; font-size:0.9rem;">Link inválido ou expirado.</p>
        <p style="color:var(--muted); font-size:0.875rem;">Peça ao administrador para reenviar o convite.</p>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://dckvprqsecaxaooppqfp.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRja3ZwcnFzZWNheGFvb3BwcWZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzOTU4MjcsImV4cCI6MjA5Nzk3MTgyN30.fY17RCGW5k_9hDIfGStJn4Xi_HpeL1ned5zrZQCOwZ4';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    let currentUser = null;

    // Processa o token do link de convite assim que a página carrega
    (async () => {
      let session = null;

      // Tenta PKCE (code no query string — Supabase v2 padrão)
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');

      if (code) {
        const { data, error } = await sb.auth.exchangeCodeForSession(code);
        if (!error) session = data.session;
      }

      // Fallback: implicit flow (access_token no hash da URL)
      if (!session) {
        const { data } = await sb.auth.getSession();
        session = data.session;
      }

      if (!session) {
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('errorState').style.display = 'block';
        return;
      }

      currentUser = session.user;

      // Busca nome do usuário
      const { data: profile } = await sb.from('profiles').select('full_name').eq('id', currentUser.id).single();
      const nome = profile?.full_name || '';

      document.getElementById('welcomeName').textContent = nome ? `, ${nome}` : '';
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('formState').style.display = 'block';

      // Foca no campo de senha
      setTimeout(() => document.getElementById('password').focus(), 100);
    })();

    async function savePassword() {
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('passwordConfirm').value;
      const err = document.getElementById('errorMsg');
      const btn = document.getElementById('saveBtn');

      err.classList.remove('show');

      if (password.length < 8) {
        err.textContent = 'A senha deve ter pelo menos 8 caracteres.';
        err.classList.add('show');
        return;
      }
      if (password !== confirm) {
        err.textContent = 'As senhas não coincidem.';
        err.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Salvando...';

      const { error } = await sb.auth.updateUser({ password });

      if (error) {
        err.textContent = error.message;
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Criar senha e entrar';
        return;
      }

      btn.textContent = '✓ Senha criada!';

      // Redireciona para setup ou app dependendo se já tem empresa
      const { data: profile } = await sb.from('profiles').select('company_id, role').eq('id', currentUser.id).single();

      setTimeout(() => {
        if (profile?.role === 'admin') {
          window.location.href = '/admin.html';
        } else if (profile?.company_id) {
          window.location.href = '/app.html';
        } else {
          window.location.href = '/setup.html';
        }
      }, 800);
    }

    function checkStrength(val) {
      const fill = document.getElementById('strengthFill');
      const text = document.getElementById('strengthText');
      if (!val) { fill.style.width = '0'; text.textContent = ''; return; }

      let score = 0;
      if (val.length >= 8) score++;
      if (val.length >= 12) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      const levels = [
        { w: '20%', c: '#ff6b6b', t: 'Muito fraca' },
        { w: '40%', c: '#ffa500', t: 'Fraca' },
        { w: '60%', c: '#ffc107', t: 'Média' },
        { w: '80%', c: '#00c851', t: 'Forte' },
        { w: '100%', c: '#00e87a', t: 'Muito forte' }
      ];
      const lvl = levels[Math.min(score - 1, 4)] || levels[0];
      fill.style.width = lvl.w;
      fill.style.background = lvl.c;
      text.textContent = lvl.t;
      text.style.color = lvl.c;
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') savePassword();
    });
  </script>
</body>
</html>
