<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Delta Soluções">
  <defs>
    <linearGradient id="dEsq" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#17A39B"/><stop offset=".55" stop-color="#2FD3E8"/><stop offset="1" stop-color="#7EE8F5"/>
    </linearGradient>
    <linearGradient id="dDir" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#A855F7"/><stop offset=".5" stop-color="#4F7BF5"/><stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="dBase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17A39B"/><stop offset=".65" stop-color="#29B6E8"/><stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="dSeta" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FACC15"/><stop offset="1" stop-color="#FDE047"/>
    </linearGradient>
  </defs>

  <!-- perna esquerda: do ápice até a base -->
  <path d="M120 28 L150 86 L72 222 L18 222 Z" fill="url(#dEsq)"/>
  <!-- chanfro claro da perna esquerda -->
  <path d="M120 28 L150 86 L128 92 Z" fill="#BDF2FA" opacity=".55"/>

  <!-- perna direita: sobe da base rumo à seta -->
  <path d="M238 222 L184 222 L140 132 L170 76 Z" fill="url(#dDir)"/>
  <path d="M170 76 L140 132 L160 136 Z" fill="#9BE2FB" opacity=".45"/>

  <!-- travessão -->
  <path d="M74 170 L206 170 L192 206 L58 206 Z" fill="url(#dBase)"/>
  <!-- faixas amarelas do travessão -->
  <path d="M168 170 L182 170 L168 206 L154 206 Z" fill="url(#dSeta)"/>
  <path d="M192 170 L206 170 L192 206 L178 206 Z" fill="url(#dSeta)"/>

  <!-- seta amarela -->
  <path d="M224 30 L214 82 L198 64 L176 50 Z" fill="url(#dSeta)"/>
</svg>
